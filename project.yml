name: LLMQuotaApp
options:
  bundleIdPrefix: org.example
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: zh-Hans
settings:
  base:
    SWIFT_VERSION: 6.0
    CODE_SIGNING_ALLOWED: NO
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: YES
    MARKETING_VERSION: 1.0
    CURRENT_PROJECT_VERSION: 202609142215
targets:
  LLMQuotaApp:
    type: application
    platform: iOS
    sources:
      - path: LLMQuotaApp
      # 隐私清单必须作为资源打进包里（2024 年起 App Store 强制要求）。
      - path: LLMQuotaApp/PrivacyInfo.xcprivacy
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.example.quotient.mobile
        PRODUCT_MODULE_NAME: LLMQuotaApp
        # 包/可执行文件用稳定的 ASCII 名，桌面显示名仍由 CFBundleDisplayName 决定。
        # 否则 XCTest 自动推导的 TEST_HOST 会指向不存在的 LLMQuotaApp.app。
        PRODUCT_NAME: LLMQuotaApp
        INFOPLIST_KEY_CFBundleDisplayName: 数字员工
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        # iPad 必须四个方向全支持，否则上传直接被拒（错误码 90474）——
        # 只要 TARGETED_DEVICE_FAMILY 里带了 2，苹果就按 iPad 多任务要求校验。
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: LLMQuotaApp/LLMQuotaApp.entitlements
    info:
      path: LLMQuotaApp/Info.plist
      properties:
        CFBundleDisplayName: 数字员工
        # 版本号只认上面 settings 里的 MARKETING_VERSION / CURRENT_PROJECT_VERSION。
        # xcodegen 每次 generate 都会按这里重写 Info.plist,不写这两行它就填默认的 1.0/1,
        # 上传 TestFlight 会被拒("bundle version must be higher than …")。
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        # 声明没有用到需要出口许可的加密。
        #
        # 这个 App 只读写本地和 iCloud 里的 JSON —— 用到的加密只有系统
        # HTTPS 那部分，属于豁免范围。不声明的话每次提交 TestFlight
        # 都会被拦下来问一遍出口合规，很烦而且答案永远一样。
        ITSAppUsesNonExemptEncryption: false

        # 让 App 的 Documents 出现在「文件」App 里。
        # 对真实使用也有意义：没有 iCloud 时可以退回本地文件夹工作，
        # 也能直接把任务文本拖进来。
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true

  LLMQuotaAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: LLMQuotaAppTests
    dependencies:
      - target: LLMQuotaApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.example.quotient.mobile.tests
        GENERATE_INFOPLIST_FILE: YES

  LLMQuotaAppUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: LLMQuotaAppUITests
    dependencies:
      - target: LLMQuotaApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.example.quotient.mobile.uitests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  LLMQuotaApp:
    build:
      targets:
        LLMQuotaApp: all
        LLMQuotaAppTests: [test]
        LLMQuotaAppUITests: [test]
    test:
      targets:
        - LLMQuotaAppTests
        - LLMQuotaAppUITests
